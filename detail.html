<script>
  document.addEventListener("DOMContentLoaded", () => {
    muatKomponen();
    muatDetailKonten("detail-konten", "tautan-kembali");
  });

  // Global helper untuk memunculkan toast
  function tampilkanToast(pesan, ikon = "check_circle") {
    const toast = document.getElementById("toast-notifikasi");
    const toastMsg = document.getElementById("toast-message");
    const toastIcon = document.getElementById("toast-icon");
    if (!toast || !toastMsg) return;

    toastMsg.textContent = pesan;
    if (toastIcon) toastIcon.textContent = ikon;

    toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
    toast.classList.add("translate-y-0", "opacity-100");

    setTimeout(() => {
      toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
      toast.classList.remove("translate-y-0", "opacity-100");
    }, 3500);
  }
</script>
