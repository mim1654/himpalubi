# Membangun halaman berita/kegiatan + sitemap, lalu menerbitkan ke GitHub Pages.
# Jalan otomatis setiap ada perubahan di branch main, dan bisa dijalankan manual dari tab Actions.
# Pemicu: (1) perubahan di main, (2) manual, (3) tiap 2 jam sebagai cadangan, (4) dipanggil Supabase
# lewat API GitHub saat berita/kegiatan ditambah, diubah, atau dihapus (lihat sql/migrasi_picu_terbit_situs.sql).
name: Terbitkan situs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *" # waktu UTC; GitHub bisa menunda beberapa menit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bangun halaman statis dan sitemap
        run: node scripts/bangun-halaman.mjs
        env:
          # Boleh kosong: skrip membaca js/supabaseClient.js bila rahasia ini belum dibuat.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
