<span aria-hidden="true" class="material-symbols-outlined text-inverse-primary text-[20px]" id="toast-icon">check_circle</span>
<span id="toast-message">Tautan artikel berhasil disalin!</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js?v=5.2"></script>
<script src="js/public.js?v=5.6"></script>
<script src="js/components.js?v=5.2"></script>
<script>
// Halaman ini sudah berisi artikel lengkap di HTML-nya (dibuat saat build).
// Script di bawah hanya menyalakan fitur tambahan: header/footer, hitung pembaca, salin tautan, dengarkan.
function tampilkanToast(pesan, ikon = "check_circle") {
  const toast = document.getElementById("toast-notifikasi");
  const toastMsg = document.getElementById("toast-message");
  const toastIcon = document.getElementById("toast-icon");
  if (!toast || !toastMsg) return;
  toastMsg.textContent = pesan;
  if (toastIcon) toastIcon.textContent = ikon;
  toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
  toast.classList.add("translate-y-0", "opacity-100");
  setTimeout(() => {
    toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
    toast.classList.remove("translate-y-0", "opacity-100");
  }, 3500);
}

function pasangSalinTautan() {
  const alamat = document.querySelector('link[rel="canonical"]').href;
  document.querySelectorAll(".btn-copy-link").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (!navigator.clipboard) { tampilkanToast("Peramban ini tidak mendukung salin otomatis.", "error"); return; }
      navigator.clipboard.writeText(alamat)
        .then(() => tampilkanToast("Tautan artikel berhasil disalin!", "check_circle"))
        .catch(() => tampilkanToast("Gagal menyalin tautan.", "error"));
    });
  });
}

function pasangDengar() {
  const btn = document.getElementById("btn-dengar");
  if (!btn || !("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") return;
  btn.classList.remove("hidden");
  btn.classList.add("flex");
  const ikon = btn.querySelector(".material-symbols-outlined");
  const atur = (aktif) => {
    btn.setAttribute("aria-pressed", aktif ? "true" : "false");
    btn.setAttribute("aria-label", aktif ? "Hentikan pembacaan artikel" : "Dengarkan artikel");
    btn.title = aktif ? "Hentikan Pembacaan" : "Dengarkan Artikel";
    if (ikon) ikon.textContent = aktif ? "stop_circle" : "volume_up";
  };
  btn.addEventListener("click", () => {
    if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); atur(false); return; }
    const judul = document.querySelector("#detail-konten h1");
    const isi = document.querySelector("#detail-konten .detail-isi");
    const teks = [judul && judul.textContent.trim(), isi && isi.innerText.trim()].filter(Boolean).join(". ");
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = "id-ID";
    u.onend = u.onerror = () => atur(false);
    window.speechSynthesis.speak(u);
    atur(true);
  });
  window.addEventListener("pagehide", () => window.speechSynthesis.cancel());
}

document.addEventListener("DOMContentLoaded", () => {
  muatKomponen();
  const id = document.body.dataset.artikelId;
  if (id && typeof tambahKlikBerita === "function") tambahKlikBerita(id);
  pasangSalinTautan();
  pasangDengar();
});
</script>
