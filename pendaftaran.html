<body data-page="pendaftaran">
<a href="#konten" class="skip-link">Langsung ke konten</a>

<div id="site-header-slot"></div>

<main id="konten">
  <section class="hero" style="padding:3rem 0; background:var(--sage-100); color:var(--ink-900); text-align:left;">
    <div class="container" style="max-width:1080px;">
      <h1 style="color:var(--ink-900);">Pendaftaran Anggota Baru</h1>
      <p class="lead" style="color:var(--ink-600); margin:0;">Isi formulir berikut untuk bergabung bersama HIMPALUBI. Tim pengurus akan meninjau dan menghubungimu.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div id="pesan-pendaftaran"></div>
      <form id="form-pendaftaran">
        <div class="field">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" required>
        </div>
        <div class="field">
          <label for="nim">NIM</label>
          <input type="text" id="nim" name="nim" pattern="[A-Za-z0-9]{6,20}" title="NIM boleh berisi huruf dan angka, 6-20 karakter" placeholder="Contoh: 231F10014" required>
        </div>
        <div class="field">
          <label for="program_studi">Program Studi</label>
          <input type="text" id="program_studi" name="program_studi" required>
        </div>
        <div class="field">
          <label for="angkatan">Angkatan</label>
          <input type="text" id="angkatan" name="angkatan" placeholder="Contoh: 2025" required>
        </div>
        <div class="field">
          <label for="no_wa">Nomor WhatsApp</label>
          <input type="tel" id="no_wa" name="no_wa" inputmode="tel" pattern="^(\+62|62|0)8[0-9]{8,12}$" title="Format nomor Indonesia, contoh: 08123456789" placeholder="Contoh: 08123456789" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="alasan">Alasan Bergabung</label>
          <textarea id="alasan" name="alasan" required></textarea>
        </div>
        <button type="submit" class="btn">Kirim Pendaftaran</button>
      </form>
    </div>
  </section>
</main>

<div id="site-footer-slot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

</body>
