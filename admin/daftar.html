<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Admin — HIMPALUBI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-brand-panel">
    <picture><source srcset="../img/logo.webp" type="image/webp"><img src="../img/logo.png" alt="Logo HIMPALUBI" width="110" height="110"></picture>
    <h2>Daftar sebagai Admin</h2>
    <p>Hanya email yang sudah diundang oleh admin lain yang akan otomatis mendapat akses.</p>
  </div>
  <div class="login-form-panel">
    <div class="login-card">
      <h1 style="font-size:1.5rem; margin-bottom:0.35rem;">Buat Akun</h1>
      <p style="color:var(--ink-600); margin-bottom:1.75rem;">Gunakan email yang sama dengan yang diundang oleh admin.</p>
      <div id="pesan-daftar"></div>
      <form id="form-daftar-admin">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Buat Kata Sandi</label>
          <div class="password-toggle-wrap">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" id="toggle-password-daftar">Lihat</button>
          </div>
          <p class="hint">Minimal 8 karakter.</p>
        </div>
        <button type="submit" class="btn" style="width:100%;">Daftar</button>
      </form>
      <p style="margin-top:1.5rem;"><a href="login.html">&larr; Sudah punya akun? Masuk</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/public.js"></script>
<script src="../js/admin.js"></script>
<script>
  pasangFormDaftarAdmin("form-daftar-admin");
  pasangTogglePassword("password", "toggle-password-daftar");
</script>
</body>
</html>
