<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — HIMPALUBI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <p class="brand" style="justify-content:center; color:var(--teal-900); margin-bottom:1.5rem;"><img src="../img/logo.png" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:50%;">HIM<strong style="color:var(--gold-500)">PALUBI</strong></p>
    <h1 style="font-size:1.4rem;">Login Pengurus</h1>
    <p style="color:var(--ink-600); margin-bottom:1.5rem;">Khusus admin dan pengurus organisasi.</p>
    <div id="pesan-login"></div>
    <form id="form-login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width:100%;">Masuk</button>
    </form>
    <p style="margin-top:1.5rem;"><a href="../index.html">&larr; Kembali ke website</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/admin.js"></script>
<script>
  pasangFormLogin("form-login");
</script>
</body>
</html>
